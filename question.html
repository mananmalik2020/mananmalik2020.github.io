<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row mb-3">
      <div class="col-md-6 position-relative">
        <input type="text" id="question-search" class="form-control" placeholder="Search question in chapter...">
        <!-- results dropdown: hidden by default, appears while typing -->
        <div id="questions" class="list-group" style="display:none; position: absolute; z-index: 1000; width:100%; max-height:300px; overflow:auto;"> </div>
      </div>
    </div>
    <h1 id="question-title" class="mb-4"></h1>
    <div id="question-image" class="mb-4"></div>
    <h3>Answer</h3>
    <div id="answer-images" class="mb-4"></div>
    <a id="back-link" href="#" class="btn btn-secondary mt-4">Back to Questions</a>
    <a id="next-question" href="#" class="btn btn-primary mt-4 float-end">Next Question</a>
  </div>
  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }
  const chapterNum = getQueryParam('chapter');
  const questionNum = getQueryParam('question');
  let allQuestions = [];
    fetch('ts_grewal_accounts_12_2024/ts_grewal_accounts_12_2024.json')
      .then(response => response.json())
      .then(masterData => {
        const chapterMeta = masterData.find(c => c.chapter == chapterNum);
        if (!chapterMeta) {
          document.getElementById('question-title').textContent = 'Chapter not found';
          return;
        }
        fetch(chapterMeta.questions_json_link)
          .then(response => response.json())
          .then(chapter => {
                allQuestions = chapter.questions;
                const question = chapter.questions.find(q => q.number == questionNum);
            if (!question) {
              document.getElementById('question-title').textContent = 'Question not found';
              return;
            }
            document.getElementById('question-title').textContent = `Chapter ${chapter.chapter}: ${chapter.chapter_name} - Question ${question.number}`;
            // Render question images. Accept either a single string or an array for backwards compatibility.
            const qImageDiv = document.getElementById('question-image');
            qImageDiv.innerHTML = '';
            const qImages = Array.isArray(question.image_url) ? question.image_url : (question.image_url ? [question.image_url] : []);
            qImages.forEach(url => {
              const img = document.createElement('img');
              img.src = url;
              img.className = 'img-fluid rounded border me-2 mb-2';
              img.alt = 'Question Image';
              qImageDiv.appendChild(img);
            });
            // Render answer images if present
            const answerDiv = document.getElementById('answer-images');
            answerDiv.innerHTML = '';
            const aImages = Array.isArray(question.answer_image_url) ? question.answer_image_url : (question.answer_image_url ? [question.answer_image_url] : []);
            aImages.forEach(url => {
              const img = document.createElement('img');
              img.src = url;
              img.className = 'img-fluid rounded border me-2 mb-2';
              img.alt = 'Answer Image';
              answerDiv.appendChild(img);
            });
            document.getElementById('back-link').href = `chapter?chapter=${chapter.chapter}`;
            // Set next question button
            const nextNum = parseInt(questionNum) + 1;
            const nextQuestion = chapter.questions.find(q => q.number == nextNum);
            const nextBtn = document.getElementById('next-question');
            if (nextQuestion) {
              nextBtn.href = `question?chapter=${chapter.chapter}&question=${nextNum}`;
              nextBtn.style.display = '';
            } else {
              nextBtn.style.display = 'none';
            }
          });
      });

    function renderQuestionList(questions) {
      const questionsDiv = document.getElementById('questions');
      if (!questionsDiv) return;
      questionsDiv.innerHTML = '';
      questions.forEach((q) => {
        const a = document.createElement('a');
        a.className = 'list-group-item list-group-item-action';
        a.href = `question?chapter=${chapterNum}&question=${q.number}`;
        a.textContent = `Question ${q.number}: ${q.question_text}`;
        if (`${q.number}` == `${questionNum}`) {
          a.classList.add('active');
        }
        questionsDiv.appendChild(a);
      });
    }

    const searchInput = document.getElementById('question-search');
    const questionsDiv = document.getElementById('questions');
    function adjustDropdownToInput() {
      // size and align the dropdown to match the input exactly
      const rect = searchInput.getBoundingClientRect();
      const parentRect = searchInput.offsetParent.getBoundingClientRect();
      const left = searchInput.offsetLeft; // relative to offsetParent
      const width = searchInput.offsetWidth;
      questionsDiv.style.left = left + 'px';
      questionsDiv.style.width = width + 'px';
      questionsDiv.style.boxSizing = 'border-box';
    }

    searchInput.addEventListener('input', function() {
      const val = this.value.trim();
      const search = val.toLowerCase();
      if (!val) {
        questionsDiv.style.display = 'none';
        questionsDiv.innerHTML = '';
        return;
      }
      const filtered = allQuestions.filter(q => {
        const numMatch = (`${q.number}`).toLowerCase().includes(search);
        const textMatch = (q.question_text || '').toLowerCase().includes(search);
        return numMatch || textMatch;
      }).slice(0, 10); // limit results
      renderQuestionList(filtered);
      // ensure the dropdown exactly matches the input width/alignment
      adjustDropdownToInput();
      questionsDiv.style.display = filtered.length ? 'block' : 'none';
    });

    // hide dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!document.getElementById('question-search').contains(e.target) && !questionsDiv.contains(e.target)) {
        questionsDiv.style.display = 'none';
      }
    });

    // Recalculate on window resize so dropdown stays aligned
    window.addEventListener('resize', () => {
      if (questionsDiv.style.display !== 'none') adjustDropdownToInput();
    });
  </script>
</body>
</html>
